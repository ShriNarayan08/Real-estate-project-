spring.application.name=RealEstate

spring.datasource.url=jdbc:mysql://localhost:3306/RealEstate
spring.datasource.username=root
spring.datasource.password=narayan8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Server port (optional, default is 8080)
#server.port=9098

# JSP View Resolver configuration
spring.mvc.view.prefix=/jsp/
spring.mvc.view.suffix=.jsp

# Set web application type to servlet for WAR deployment
spring.main.web-application-type=servlet

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Optional: if you store images in static/uploads
spring.web.resources.static-locations=classpath:/static/,file:uploads/


# Email Configuration (using Gmail SMTP as an example)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com # Your Gmail address
spring.mail.password=your_app_password # IMPORTANT: Use an App Password if 2FA is enabled
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 # Recommended for newer Java versions

# If you face issues with starttls, you might try:
# spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com


